name: Generate profile icosahedron

on:
  push:
    paths:
      - scripts/generate_profile_icosahedron.py
      - .github/workflows/generate-profile-icosahedron.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-icosahedron
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate mathematically regular 3D banners
        run: |
          python3 scripts/generate_profile_icosahedron.py
          mkdir -p assets/profile
          mv dark.svg assets/profile/banner-dark.svg
          mv light.svg assets/profile/banner-light.svg

      - name: Validate SVG output
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in (
              "assets/profile/banner-dark.svg",
              "assets/profile/banner-light.svg",
          ):
              ET.parse(name)
              text = Path(name).read_text(encoding="utf-8")
              assert "mathematically regular 3D icosahedron" in text
              assert "30 equal edges" in text
              print(f"validated {name}: {len(text)} bytes")
          PY

      - name: Commit generated banners
        run: |
          if git diff --quiet -- assets/profile/banner-dark.svg assets/profile/banner-light.svg; then
            echo "Generated banners are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/banner-dark.svg assets/profile/banner-light.svg
          git commit -m "feat: render mathematically regular 3D icosahedron"
          git push
