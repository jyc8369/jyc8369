<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-label="jyc8369@github: ~/profile $ ./values"><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250DF"><animate attributeName="stop-color" values="#8250DF;#0969DA;#1A7F37;#8250DF" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0969DA"><animate attributeName="stop-color" values="#0969DA;#1A7F37;#8250DF;#0969DA" dur="12s" repeatCount="indefinite"/></stop></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="260" rx="20" fill="#F6F8FA"/><rect x="18" y="18" width="1064" height="224" rx="18" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="2"/><rect x="18" y="18" width="1064" height="42" fill="#EEF2F7"/><circle cx="43" cy="39" r="5.5" fill="#FF5F56"/><circle cx="62" cy="39" r="5.5" fill="#FFBD2E"/><circle cx="81" cy="39" r="5.5" fill="#27C93F"/><text x="550" y="44" text-anchor="middle" fill="#6E7781" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ ./values</text><rect x="18" y="59" width="1064" height="2" fill="url(#accent)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="58" y="96" fill="#6E7781" font-size="11" letter-spacing="2.4">HOW I BUILD</text><text x="58" y="128" fill="#1F2328" font-size="26" font-weight="700">What I value when I build</text><g transform="translate(58 148)"><rect width="234" height="82" rx="14" fill="#F4F7FB" stroke="#D0D7E2"/><text x="18" y="25" fill="#1A7F37" font-size="12" font-weight="700">01</text><text x="48" y="25" fill="#1F2328" font-size="14" font-weight="700">CONVENIENCE</text><text x="18" y="50" fill="#4B5563" font-size="11">Reduce unnecessary effort.</text><text x="18" y="68" fill="#6E7781" font-size="10.5">Let software handle avoidable complexity.</text><rect x="0" y="0" width="4" height="82" rx="2" fill="#1A7F37"><animate attributeName="opacity" values="0.45;1;0.45" dur="4s" repeatCount="indefinite"/></rect></g><g transform="translate(310 148)"><rect width="234" height="82" rx="14" fill="#F4F7FB" stroke="#D0D7E2"/><text x="18" y="25" fill="#0969DA" font-size="12" font-weight="700">02</text><text x="48" y="25" fill="#1F2328" font-size="14" font-weight="700">EFFICIENCY</text><text x="18" y="50" fill="#4B5563" font-size="11">Automate repetitive work.</text><text x="18" y="68" fill="#6E7781" font-size="10.5">Reach the same result with fewer steps.</text><rect x="0" y="0" width="4" height="82" rx="2" fill="#0969DA"><animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/></rect></g><g transform="translate(562 148)"><rect width="234" height="82" rx="14" fill="#F4F7FB" stroke="#D0D7E2"/><text x="18" y="25" fill="#8250DF" font-size="12" font-weight="700">03</text><text x="48" y="25" fill="#1F2328" font-size="14" font-weight="700">PRACTICALITY</text><text x="18" y="50" fill="#4B5563" font-size="11">Solve a clear problem well.</text><text x="18" y="68" fill="#6E7781" font-size="10.5">Useful beats feature-heavy.</text><rect x="0" y="0" width="4" height="82" rx="2" fill="#8250DF"><animate attributeName="opacity" values="0.45;1;0.45" dur="6s" repeatCount="indefinite"/></rect></g><g transform="translate(814 148)"><rect width="234" height="82" rx="14" fill="#F4F7FB" stroke="#D0D7E2"/><text x="18" y="25" fill="#0969DA" font-size="12" font-weight="700">04</text><text x="48" y="25" fill="#1F2328" font-size="14" font-weight="700">ITERATION</text><text x="18" y="50" fill="#4B5563" font-size="11">Ship, use, observe, improve.</text><text x="18" y="68" fill="#6E7781" font-size="10.5">Let real use guide the next change.</text><rect x="0" y="0" width="4" height="82" rx="2" fill="#0969DA"><animate attributeName="opacity" values="0.45;1;0.45" dur="7s" repeatCount="indefinite"/></rect></g></g></svg>