<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="About jyc8369"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"><animate attributeName="stop-color" values="#C4B5FD;#67E8F9;#4ADE80;#C4B5FD" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#67E8F9"><animate attributeName="stop-color" values="#67E8F9;#4ADE80;#C4B5FD;#67E8F9" dur="12s" repeatCount="indefinite"/></stop></linearGradient></defs><rect width="1200" height="420" rx="22" fill="#070B12"/><rect x="20" y="20" width="1160" height="380" rx="20" fill="#0D1117" stroke="#26344D" stroke-width="2"/><rect x="20" y="20" width="1160" height="48" fill="#080E19"/><circle cx="46" cy="44" r="6" fill="#FF5F56"/><circle cx="67" cy="44" r="6" fill="#FFBD2E"/><circle cx="88" cy="44" r="6" fill="#27C93F"/><text x="600" y="49" text-anchor="middle" fill="#718096" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ cat about.txt</text><rect x="20" y="67" width="1160" height="2" fill="url(#a)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="64" y="112" fill="#718096" font-size="12" letter-spacing="2.4">ABOUT ME</text><text x="64" y="152" fill="#F2F6FF" font-size="32" font-weight="700">I build software around friction I can actually see.</text><text x="64" y="182" fill="#AAB6CC" font-size="14">I like finding inconvenient, repetitive, or overly complex workflows and turning them into focused tools.</text><text x="64" y="204" fill="#AAB6CC" font-size="14">That is how I learn what users need and what makes software truly convenient in practice.</text><rect x="64" y="238" width="332" height="112" rx="16" fill="#101723" stroke="#26344D"/><text x="84" y="269" fill="#C4B5FD" font-size="15" font-weight="700">1. Notice real friction</text><text x="84" y="292" fill="#D8E1F0" font-size="12">Start from an inconvenience I can explain clearly.</text><text x="84" y="316" fill="#718096" font-size="11.5">repetition · confusing steps · wasted time</text><circle cx="367" cy="268" r="8" fill="#C4B5FD" opacity="0.18"><animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/></circle><rect x="434" y="238" width="332" height="112" rx="16" fill="#101723" stroke="#26344D"/><text x="454" y="269" fill="#67E8F9" font-size="15" font-weight="700">2. Build a usable fix</text><text x="454" y="292" fill="#D8E1F0" font-size="12">Prefer small tools that solve one concrete problem well.</text><text x="454" y="316" fill="#718096" font-size="11.5">developer tools · utilities · automation</text><circle cx="737" cy="268" r="8" fill="#67E8F9" opacity="0.18"><animate attributeName="r" values="11;7;11" dur="4s" repeatCount="indefinite"/></circle><rect x="804" y="238" width="332" height="112" rx="16" fill="#101723" stroke="#26344D"/><text x="824" y="269" fill="#4ADE80" font-size="15" font-weight="700">3. Learn from operation</text><text x="824" y="292" fill="#D8E1F0" font-size="12">Understand both writing software and running it.</text><text x="824" y="316" fill="#718096" font-size="11.5">DevOps · Systems Engineering · reliability</text><circle cx="1107" cy="268" r="8" fill="#4ADE80" opacity="0.18"><animate attributeName="r" values="7;10;7" dur="5s" repeatCount="indefinite"/></circle><text x="64" y="382" fill="#718096" font-size="12">Goal: understand software, infrastructure, and the needs of the people using both.</text></g></svg>