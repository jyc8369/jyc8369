<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Featured projects"><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"><animate attributeName="stop-color" values="#C4B5FD;#67E8F9;#4ADE80;#C4B5FD" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#67E8F9"><animate attributeName="stop-color" values="#67E8F9;#4ADE80;#C4B5FD;#67E8F9" dur="12s" repeatCount="indefinite"/></stop></linearGradient></defs><rect width="1200" height="800" rx="34" fill="#070B12"/><rect x="20" y="20" width="1160" height="760" rx="28" fill="#0D1117" stroke="#26344D" stroke-width="2"/><path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#080E19"/><circle cx="48" cy="46" r="6" fill="#FF5F56"/><circle cx="70" cy="46" r="6" fill="#FFBD2E"/><circle cx="92" cy="46" r="6" fill="#27C93F"/><text x="600" y="51" text-anchor="middle" fill="#8290A8" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ ls featured-projects</text><rect x="20" y="71" width="1160" height="2" fill="url(#accent)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><text x="70" y="126" fill="#5D6B82" font-size="13" letter-spacing="2.7">FEATURED PROJECTS</text><text x="70" y="172" fill="#F2F6FF" font-size="36" font-weight="700">Projects built around problems I actually wanted to solve</text><text x="70" y="210" fill="#D8E1F0" font-size="16"><tspan x="70" dy="0">These projects are small by design: each one starts from a concrete inconvenience,</tspan><tspan x="70" dy="27">then turns that problem into a tool, extension, or experiment that can be used in practice.</tspan></text><g transform="translate(70 300)"><rect width="510" height="190" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="150" rx="4" fill="#C4B5FD"/><text x="52" y="43" fill="#C4B5FD" font-size="17" font-weight="700">Minecraft Mod Translator Gemini</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Translates Minecraft mod language files with Gemini,</tspan><tspan x="52" dy="23">then rebuilds a translated copy of the mod package.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">Python · Gemini API · automation</tspan></text></g><g transform="translate(620 300)"><rect width="510" height="190" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="150" rx="4" fill="#67E8F9"/><text x="52" y="43" fill="#67E8F9" font-size="17" font-weight="700">Codex Multi Login</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">A VS Code extension for managing multiple Codex</tspan><tspan x="52" dy="23">accounts and switching between them more easily.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">TypeScript · VS Code · developer tooling</tspan></text></g><g transform="translate(70 530)"><rect width="510" height="170" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="130" rx="4" fill="#4ADE80"/><text x="52" y="43" fill="#4ADE80" font-size="17" font-weight="700">Icon Bundler</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Converts source images into Windows ICO and macOS</tspan><tspan x="52" dy="23">ICNS files for application packaging.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">Python · desktop utility · packaging</tspan></text></g><g transform="translate(620 530)"><rect width="510" height="170" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="130" rx="4" fill="#F9A8D4"/><text x="52" y="43" fill="#F9A8D4" font-size="17" font-weight="700">Cost Aware Agent Router</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Routes reasoning-heavy work to stronger available</tspan><tspan x="52" dy="23">agents while keeping deterministic execution local.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">Codex plugin · agent routing · local execution</tspan></text></g><text x="70" y="754" fill="#8290A8" font-size="13">Representative work · see the repository links below this panel for source code and details.</text></g></svg>