<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="650"
  viewBox="0 0 1200 650"
  role="img"
  aria-label="What I value"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#8250DF">
        <animate
          attributeName="stop-color"
          values="#8250DF;#0969DA;#1A7F37;#8250DF"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="1" stop-color="#0969DA">
        <animate
          attributeName="stop-color"
          values="#0969DA;#1A7F37;#8250DF;#0969DA"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="34" fill="#F6F8FA"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="610"
    rx="28"
    fill="#FFFFFF"
    stroke="#D0D7E2"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#F0F3F7"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#6E7781"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
  >jyc8369@github: ~/profile $ cat values.txt</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="126" fill="#8A949F" font-size="13" letter-spacing="2.7">WHAT I VALUE</text>
    <text x="70" y="172" fill="#1F2328" font-size="36" font-weight="700">Convenience and efficiency are the starting point.</text>
    <text
      x="70"
      y="210"
      fill="#24292F"
      font-size="16"
    ><tspan x="70" dy="0">Useful software should remove unnecessary work instead of moving complexity onto the user.</tspan><tspan x="70" dy="27">I prefer clear workflows, practical results, and improvements that can be felt immediately.</tspan></text>
    <g transform="translate(70 292)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#8250DF"
      />
      <text x="52" y="43" fill="#8250DF" font-size="17" font-weight="700">Convenience</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Reduce unnecessary effort so the user can focus</tspan><tspan x="52" dy="23">on the task they actually care about.</tspan></text>
    </g>
    <g transform="translate(620 292)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#0969DA"
      />
      <text x="52" y="43" fill="#0969DA" font-size="17" font-weight="700">Efficiency</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Prefer fewer steps, less repetition, and a faster</tspan><tspan x="52" dy="23">path to the same reliable result.</tspan></text>
    </g>
    <g transform="translate(70 452)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#1A7F37"
      />
      <text x="52" y="43" fill="#1A7F37" font-size="17" font-weight="700">Practicality</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">A small project is valuable when it solves a clear</tspan><tspan x="52" dy="23">problem and fits into a real workflow.</tspan></text>
    </g>
    <g transform="translate(620 452)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#BF3989"
      />
      <text x="52" y="43" fill="#BF3989" font-size="17" font-weight="700">Iteration</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Ship a usable version, observe the next source of</tspan><tspan x="52" dy="23">friction, and improve it step by step.</tspan></text>
    </g>
  </g>
</svg>
