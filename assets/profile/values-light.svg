<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="What I value"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250DF"><animate attributeName="stop-color" values="#8250DF;#0969DA;#1A7F37;#8250DF" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0969DA"><animate attributeName="stop-color" values="#0969DA;#1A7F37;#8250DF;#0969DA" dur="12s" repeatCount="indefinite"/></stop></linearGradient><filter id="g"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="30" fill="#F6F8FA"/><rect x="20" y="20" width="1160" height="380" rx="24" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="2"/><path d="M44 20H1156Q1180 20 1180 44V68H20V44Q20 20 44 20Z" fill="#F0F3F7"/><circle cx="46" cy="44" r="6" fill="#FF5F56"/><circle cx="67" cy="44" r="6" fill="#FFBD2E"/><circle cx="88" cy="44" r="6" fill="#27C93F"/><text x="600" y="49" text-anchor="middle" fill="#57606A" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ cat values.txt</text><rect x="20" y="67" width="1160" height="2" fill="url(#a)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="64" y="112" fill="#6E7781" font-size="12" letter-spacing="2.4">WHAT I VALUE</text><text x="64" y="152" fill="#1F2328" font-size="32" font-weight="700">Convenience and efficiency are the starting point.</text><text x="64" y="180" fill="#57606A" font-size="14">Useful software should remove work, not move complexity onto the user.</text><g transform="translate(64 216)"><rect width="522" height="76" rx="16" fill="#F6F8FA" stroke="#D0D7E2"/><circle cx="35" cy="38" r="16" fill="#8250DF" opacity="0.10"/><path d="M28 38h14M35 31v14" stroke="#8250DF" stroke-width="2" stroke-linecap="round" filter="url(#g)"/><text x="68" y="30" fill="#8250DF" font-size="15" font-weight="700">Convenience</text><text x="68" y="51" fill="#24292F" font-size="12">Reduce unnecessary effort so the user can focus on the real task.</text></g><g transform="translate(614 216)"><rect width="522" height="76" rx="16" fill="#F6F8FA" stroke="#D0D7E2"/><circle cx="35" cy="38" r="16" fill="#0969DA" opacity="0.10"/><path d="M28 43l7-11 7 7" fill="none" stroke="#0969DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/><text x="68" y="30" fill="#0969DA" font-size="15" font-weight="700">Efficiency</text><text x="68" y="51" fill="#24292F" font-size="12">Prefer fewer steps, less repetition, and faster paths to the same result.</text></g><g transform="translate(64 314)"><rect width="522" height="62" rx="16" fill="#F6F8FA" stroke="#D0D7E2"/><text x="22" y="27" fill="#1A7F37" font-size="15" font-weight="700">Practicality</text><text x="22" y="47" fill="#24292F" font-size="12">Small is fine when it solves a clear problem in a real workflow.</text></g><g transform="translate(614 314)"><rect width="522" height="62" rx="16" fill="#F6F8FA" stroke="#D0D7E2"/><text x="22" y="27" fill="#BF3989" font-size="15" font-weight="700">Iteration</text><text x="22" y="47" fill="#24292F" font-size="12">Ship a usable version, observe friction, then improve the next step.</text></g></g></svg>