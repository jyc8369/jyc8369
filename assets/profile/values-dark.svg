<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="650"
  viewBox="0 0 1200 650"
  role="img"
  aria-label="What I value"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#C4B5FD">
        <animate
          attributeName="stop-color"
          values="#C4B5FD;#67E8F9;#4ADE80;#C4B5FD"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="1" stop-color="#67E8F9">
        <animate
          attributeName="stop-color"
          values="#67E8F9;#4ADE80;#C4B5FD;#67E8F9"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="34" fill="#070B12"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="610"
    rx="28"
    fill="#0D1117"
    stroke="#26344D"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#080E19"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#8290A8"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
  >jyc8369@github: ~/profile $ cat values.txt</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="126" fill="#5D6B82" font-size="13" letter-spacing="2.7">WHAT I VALUE</text>
    <text x="70" y="172" fill="#F2F6FF" font-size="36" font-weight="700">Convenience and efficiency are the starting point.</text>
    <text
      x="70"
      y="210"
      fill="#D8E1F0"
      font-size="16"
    ><tspan x="70" dy="0">Useful software should remove unnecessary work instead of moving complexity onto the user.</tspan><tspan x="70" dy="27">I prefer clear workflows, practical results, and improvements that can be felt immediately.</tspan></text>
    <g transform="translate(70 292)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#C4B5FD"
      />
      <text x="52" y="43" fill="#C4B5FD" font-size="17" font-weight="700">Convenience</text>
      <text
        x="52"
        y="72"
        fill="#D8E1F0"
        font-size="14"
      ><tspan x="52" dy="0">Reduce unnecessary effort so the user can focus</tspan><tspan x="52" dy="23">on the task they actually care about.</tspan></text>
    </g>
    <g transform="translate(620 292)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#67E8F9"
      />
      <text x="52" y="43" fill="#67E8F9" font-size="17" font-weight="700">Efficiency</text>
      <text
        x="52"
        y="72"
        fill="#D8E1F0"
        font-size="14"
      ><tspan x="52" dy="0">Prefer fewer steps, less repetition, and a faster</tspan><tspan x="52" dy="23">path to the same reliable result.</tspan></text>
    </g>
    <g transform="translate(70 452)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#4ADE80"
      />
      <text x="52" y="43" fill="#4ADE80" font-size="17" font-weight="700">Practicality</text>
      <text
        x="52"
        y="72"
        fill="#D8E1F0"
        font-size="14"
      ><tspan x="52" dy="0">A small project is valuable when it solves a clear</tspan><tspan x="52" dy="23">problem and fits into a real workflow.</tspan></text>
    </g>
    <g transform="translate(620 452)">
      <rect
        width="510"
        height="130"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="90"
        rx="4"
        fill="#F9A8D4"
      />
      <text x="52" y="43" fill="#F9A8D4" font-size="17" font-weight="700">Iteration</text>
      <text
        x="52"
        y="72"
        fill="#D8E1F0"
        font-size="14"
      ><tspan x="52" dy="0">Ship a usable version, observe the next source of</tspan><tspan x="52" dy="23">friction, and improve it step by step.</tspan></text>
    </g>
  </g>
</svg>
