<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C4B5FD"><animate attributeName="stop-color" values="#C4B5FD;#67E8F9;#4ADE80;#C4B5FD" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#67E8F9"><animate attributeName="stop-color" values="#67E8F9;#4ADE80;#C4B5FD;#67E8F9" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="560" rx="30" fill="#070B12"/>
<rect x="20" y="20" width="1160" height="520" rx="24" fill="#0D1117" stroke="#26344D" stroke-width="2"/>
<path d="M44 20H1156Q1180 20 1180 44V68H20V44Q20 20 44 20Z" fill="#080E19"/>
<circle cx="46" cy="44" r="6" fill="#FF5F56"/><circle cx="67" cy="44" r="6" fill="#FFBD2E"/><circle cx="88" cy="44" r="6" fill="#27C93F"/>
<text x="600.0" y="49" text-anchor="middle" fill="#8290A8" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ cat values.txt</text>
<rect x="20" y="67" width="1160" height="2" fill="url(#accent)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="66" y="118" fill="#5D6B82" font-size="13" letter-spacing="2.6">WHAT I VALUE</text><text x="66" y="164" fill="#F2F6FF" font-size="34" font-weight="700">Convenience and efficiency are the starting point.</text><text x="66" y="198" fill="#D8E1F0" font-size="15">Useful software should remove work instead of moving complexity onto the user.</text><g transform="translate(66 230)"><rect width="516" height="112" rx="18" fill="#101723" stroke="#26344D"/><circle cx="42" cy="42" r="22" fill="#C4B5FD" opacity=".12"/><path d="M0 10h20M10 0v20" transform="translate(32 32)" fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><text x="82" y="35" fill="#C4B5FD" font-size="17" font-weight="700">Convenience</text><text x="82" y="61" fill="#D8E1F0" font-size="12.5">Reduce unnecessary effort and let the user focus</text><text x="82" y="82" fill="#D8E1F0" font-size="12.5">on the actual task.</text></g><g transform="translate(618 230)"><rect width="516" height="112" rx="18" fill="#101723" stroke="#26344D"/><circle cx="42" cy="42" r="22" fill="#67E8F9" opacity=".12"/><path d="M0 16L8 4l7 7 5-7" transform="translate(32 32)" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><text x="82" y="35" fill="#67E8F9" font-size="17" font-weight="700">Efficiency</text><text x="82" y="61" fill="#D8E1F0" font-size="12.5">Prefer fewer steps, less repetition, and faster paths</text><text x="82" y="82" fill="#D8E1F0" font-size="12.5">to the same result.</text></g><g transform="translate(66 365)"><rect width="516" height="112" rx="18" fill="#101723" stroke="#26344D"/><circle cx="42" cy="42" r="22" fill="#4ADE80" opacity=".12"/><path d="M2 10l5 5L18 3" transform="translate(32 32)" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><text x="82" y="35" fill="#4ADE80" font-size="17" font-weight="700">Practicality</text><text x="82" y="61" fill="#D8E1F0" font-size="12.5">A small project is valuable when it solves a clear</text><text x="82" y="82" fill="#D8E1F0" font-size="12.5">problem in a real workflow.</text></g><g transform="translate(618 365)"><rect width="516" height="112" rx="18" fill="#101723" stroke="#26344D"/><circle cx="42" cy="42" r="22" fill="#F9A8D4" opacity=".12"/><path d="M2 7a8 8 0 0114-3M18 13a8 8 0 01-14 3" transform="translate(32 32)" fill="none" stroke="#F9A8D4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><text x="82" y="35" fill="#F9A8D4" font-size="17" font-weight="700">Iteration</text><text x="82" y="61" fill="#D8E1F0" font-size="12.5">Build, use, observe friction, improve, and repeat</text><text x="82" y="82" fill="#D8E1F0" font-size="12.5">instead of chasing a perfect first version.</text></g><text x="66" y="526" fill="#8290A8" font-size="12.5">The measure is simple: does this make the real workflow easier to understand, faster to complete, or easier to maintain?</text></g>
</svg>