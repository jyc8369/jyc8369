      fill="#D8E1F0"
      font-size="16"
      font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif"><tspan x="70" dy="0">Useful software should remove unnecessary work instead of moving complexity onto the user.</tspan><tspan x="70" dy="27">I prefer clear workflows, practical results, and improvements that can be felt immediately.</tspan></text>
    <g transform="translate(70 270)">
      <rect
