<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="800"
  viewBox="0 0 1200 800"
  role="img"
  aria-label="Featured projects"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#8250DF">
        <animate
          attributeName="stop-color"
          values="#8250DF;#0969DA;#1A7F37;#8250DF"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="1" stop-color="#0969DA">
        <animate
          attributeName="stop-color"
          values="#0969DA;#1A7F37;#8250DF;#0969DA"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" rx="34" fill="#F6F8FA"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="760"
    rx="28"
    fill="#FFFFFF"
    stroke="#D0D7E2"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#F0F3F7"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#6E7781"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ ls featured-projects</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="126" fill="#8A949F" font-size="13" letter-spacing="2.7">FEATURED PROJECTS</text>
    <text x="70" y="172" fill="#1F2328" font-size="36" font-weight="700">Projects built around problems I actually wanted to solve</text>
    <text
      x="70"
      y="210"
      fill="#24292F"
      font-size="16"><tspan x="70" dy="0">These projects are small by design: each one starts from a concrete inconvenience,</tspan><tspan x="70" dy="27">then turns that problem into a tool, extension, or experiment that can be used in practice.</tspan></text>
    <g transform="translate(70 300)">
      <rect
        width="510"
        height="190"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="150"
        rx="4"
        fill="#8250DF"
      />
      <text x="52" y="43" fill="#8250DF" font-size="17" font-weight="700">Minecraft Mod Translator Gemini</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Translates Minecraft mod language files with Gemini,</tspan><tspan x="52" dy="23">then rebuilds a translated copy of the mod package.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">Python · Gemini API · automation</tspan></text>
    </g>
    <g transform="translate(620 300)">
      <rect
        width="510"
        height="190"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="150"
        rx="4"
        fill="#0969DA"
      />
      <text x="52" y="43" fill="#0969DA" font-size="17" font-weight="700">Codex Multi Login</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">A VS Code extension for managing multiple Codex</tspan><tspan x="52" dy="23">accounts and switching between them more easily.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">TypeScript · VS Code · developer tooling</tspan></text>
    </g>
    <g transform="translate(70 530)">
      <rect
        width="510"
        height="170"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="130"
        rx="4"
        fill="#1A7F37"
      />
      <text x="52" y="43" fill="#1A7F37" font-size="17" font-weight="700">Icon Bundler</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Converts source images into Windows ICO and macOS</tspan><tspan x="52" dy="23">ICNS files for application packaging.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">Python · desktop utility · packaging</tspan></text>
    </g>
    <g transform="translate(620 530)">
      <rect
        width="510"
        height="170"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="130"
        rx="4"
        fill="#BF3989"
      />
      <text x="52" y="43" fill="#BF3989" font-size="17" font-weight="700">Cost Aware Agent Router</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Routes reasoning-heavy work to stronger available</tspan><tspan x="52" dy="23">agents while keeping deterministic execution local.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">Codex plugin · agent routing · local execution</tspan></text>
    </g>
    <text
      x="70"
      y="754"
      fill="#6E7781"
      font-size="13">Representative work · see the repository links below this panel for source code and details.</text>
  </g>
</svg>
