<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="66" y="118" fill="#6E7781" font-size="13" letter-spacing="2.6">FEATURED PROJECTS</text><text x="66" y="164" fill="#1F2328" font-size="34" font-weight="700">Projects built around problems I actually wanted to solve.</text><text x="66" y="198" fill="#24292F" font-size="15">Utilities, extensions, and experiments are how I test whether an idea improves a real workflow.</text><g transform="translate(66 236)"><rect width="516" height="166" rx="20" fill="#F6F8FA" stroke="#D0D7E2"/><rect x="0" y="0" width="8" height="166" rx="4" fill="#8250DF"/><text x="30" y="38" fill="#8250DF" font-size="16" font-weight="700">01</text><text x="30" y="68" fill="#1F2328" font-size="17" font-weight="700">Minecraft Mod Translator Gemini</text><text x="30" y="99" fill="#24292F" font-size="12.5">Translate Minecraft mod language files with Gemini</text><text x="30" y="120" fill="#24292F" font-size="12.5">and rebuild a translated package.</text><path d="M30 133H486" stroke="#D0D7E2"/><text x="30" y="155" fill="#57606A" font-size="12">Python · Gemini API · automation</text></g><g transform="translate(618 236)"><rect width="516" height="166" rx="20" fill="#F6F8FA" stroke="#D0D7E2"/><rect x="0" y="0" width="8" height="166" rx="4" fill="#0969DA"/><text x="30" y="38" fill="#0969DA" font-size="16" font-weight="700">02</text><text x="30" y="68" fill="#1F2328" font-size="17" font-weight="700">Codex Multi Login</text><text x="30" y="99" fill="#24292F" font-size="12.5">Manage multiple Codex accounts and switch between</text><text x="30" y="120" fill="#24292F" font-size="12.5">them from a VS Code extension.</text><path d="M30 133H486" stroke="#D0D7E2"/><text x="30" y="155" fill="#57606A" font-size="12">TypeScript · VS Code · developer tooling</text></g><g transform="translate(66 430)"><rect width="516" height="166" rx="20" fill="#F6F8FA" stroke="#D0D7E2"/><rect x="0" y="0" width="8" height="166" rx="4" fill="#1A7F37"/><text x="30" y="38" fill="#1A7F37" font-size="16" font-weight="700">03</text><text x="30" y="68" fill="#1F2328" font-size="17" font-weight="700">Icon Bundler</text><text x="30" y="99" fill="#24292F" font-size="12.5">Convert source images into Windows ICO and macOS ICNS</text><text x="30" y="120" fill="#24292F" font-size="12.5">assets for packaging.</text><path d="M30 133H486" stroke="#D0D7E2"/><text x="30" y="155" fill="#57606A" font-size="12">Python · desktop utility · packaging</text></g><g transform="translate(618 430)"><rect width="516" height="166" rx="20" fill="#F6F8FA" stroke="#D0D7E2"/><rect x="0" y="0" width="8" height="166" rx="4" fill="#BF3989"/><text x="30" y="38" fill="#BF3989" font-size="16" font-weight="700">04</text><text x="30" y="68" fill="#1F2328" font-size="17" font-weight="700">Cost Aware Agent Router</text><text x="30" y="99" fill="#24292F" font-size="12.5">Route reasoning-heavy work to stronger available agents</text><text x="30" y="120" fill="#24292F" font-size="12.5">while keeping deterministic execution local.</text><path d="M30 133H486" stroke="#D0D7E2"/><text x="30" y="155" fill="#57606A" font-size="12">Codex plugin · agent routing · local execution</text></g><text x="66" y="642" fill="#57606A" font-size="12.5">Each project is intentionally small enough to understand, use, operate, and improve.</text></g>
