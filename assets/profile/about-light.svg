  height="650"
  viewBox="0 0 1200 650"
  role="img"
  aria-label="About jyc8369"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#8250DF">
        <animate
          attributeName="stop-color"
          values="#8250DF;#0969DA;#1A7F37;#8250DF"
