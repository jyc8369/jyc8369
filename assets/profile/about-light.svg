<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="700"
  viewBox="0 0 1200 700"
  role="img"
  aria-label="About jyc8369"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#8250DF">
        <animate
          attributeName="stop-color"
          values="#8250DF;#0969DA;#1A7F37;#8250DF"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="1" stop-color="#0969DA">
        <animate
          attributeName="stop-color"
          values="#0969DA;#1A7F37;#8250DF;#0969DA"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="34" fill="#F6F8FA"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="660"
    rx="28"
    fill="#FFFFFF"
    stroke="#D0D7E2"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#F0F3F7"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#6E7781"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ cat about.txt</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="142" fill="#1F2328" font-size="36" font-weight="700">I build software around friction I can actually see.</text>
    <text
      x="70"
      y="184"
      fill="#24292F"
      font-size="16"><tspan x="70" dy="0">I start from repetitive, inconvenient, or unnecessarily complicated workflows.</tspan><tspan x="70" dy="27">Then I turn that friction into focused tools and small services I can actually use.</tspan></text>
    <g transform="translate(70 265)">
      <rect
        width="515"
        height="165"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="125"
        rx="4"
        fill="#8250DF"
      />
      <text x="52" y="43" fill="#8250DF" font-size="17" font-weight="700">01 · Notice real friction</text>
      <text
        x="52"
        y="78"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Start from a concrete inconvenience, not a feature list.</tspan><tspan x="52" dy="24">Look for repetition, confusing steps, and wasted time.</tspan></text>
      <text x="52" y="141" fill="#6E7781" font-size="13">Problem first · features second</text>
    </g>
    <g transform="translate(615 265)">
      <rect
        width="515"
        height="165"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="125"
        rx="4"
        fill="#0969DA"
      />
      <text x="52" y="43" fill="#0969DA" font-size="17" font-weight="700">02 · Build a usable fix</text>
      <text
        x="52"
        y="78"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Keep the scope small enough to understand,</tspan><tspan x="52" dy="24">but complete enough to be useful in practice.</tspan></text>
      <text x="52" y="141" fill="#6E7781" font-size="13">Utilities · developer tools · automation</text>
    </g>
    <g transform="translate(70 460)">
      <rect
        width="1060"
        height="150"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="110"
        rx="4"
        fill="#1A7F37"
      />
      <text x="52" y="43" fill="#1A7F37" font-size="17" font-weight="700">03 · Learn from operation</text>
      <text
        x="52"
        y="78"
        fill="#24292F"
        font-size="14"><tspan x="52" dy="0">Deploy what I build and learn what becomes difficult once software leaves localhost.</tspan><tspan x="52" dy="24">Failures become feedback for the next design, deployment, and operational decision.</tspan></text>
      <g transform="translate(720 34)">
        <rect
          width="280"
          height="32"
          rx="16"
          fill="#FFFFFF"
          stroke="#1A7F37"
        />
        <text x="140" y="21" text-anchor="middle" fill="#1A7F37" font-size="13" font-weight="700">DEVOPS</text>
        <rect
          y="42"
          width="280"
          height="32"
          rx="16"
          fill="#FFFFFF"
          stroke="#0969DA"
        />
        <text x="140" y="63" text-anchor="middle" fill="#0969DA" font-size="13" font-weight="700">SYSTEMS ENGINEERING</text>
        <rect
          y="84"
          width="280"
          height="32"
          rx="16"
          fill="#FFFFFF"
          stroke="#9A6700"
        />
        <text x="140" y="105" text-anchor="middle" fill="#9A6700" font-size="13" font-weight="700">RELIABILITY</text>
      </g>
    </g>
    <text
      x="70"
      y="650"
      fill="#6E7781"
      font-size="14"><tspan x="70" dy="0">Long-term goal: connect development decisions with reliable system operation and real user needs.</tspan></text>
  </g>
</svg>
