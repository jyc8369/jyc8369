<text x="600.0" y="49" text-anchor="middle" fill="#57606A" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ cat about.txt</text>
<rect x="20" y="67" width="1160" height="2" fill="url(#accent)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<text x="66" y="118" fill="#6E7781" font-size="13" letter-spacing="2.6">ABOUT ME</text>
<text x="66" y="164" fill="#1F2328" font-size="34" font-weight="700">I build software around friction I can actually see.</text>
<text x="66" y="198" fill="#24292F" font-size="15">I look for inconvenient, repetitive, or overly complex workflows and turn them into focused tools.</text>
<text x="66" y="223" fill="#24292F" font-size="15">The goal is not more features — it is less friction for the person using the software.</text>
<path d="M96 318H1104" stroke="#D0D7E2" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(96 318)"><circle r="30" fill="#F8FAFC" stroke="#8250DF" stroke-width="2"/><text y="6" text-anchor="middle" fill="#8250DF" font-size="17" font-weight="700">01</text><text x="0" y="64" text-anchor="middle" fill="#1F2328" font-size="15" font-weight="700">NOTICE</text><text x="0" y="87" text-anchor="middle" fill="#57606A" font-size="12">Find real friction</text></g>
<g transform="translate(348 318)"><circle r="30" fill="#F8FAFC" stroke="#0969DA" stroke-width="2"/><text y="6" text-anchor="middle" fill="#0969DA" font-size="17" font-weight="700">02</text><text x="0" y="64" text-anchor="middle" fill="#1F2328" font-size="15" font-weight="700">UNDERSTAND</text><text x="0" y="87" text-anchor="middle" fill="#57606A" font-size="12">Identify wasted steps</text></g>
<g transform="translate(600 318)"><circle r="30" fill="#F8FAFC" stroke="#1A7F37" stroke-width="2"/><text y="6" text-anchor="middle" fill="#1A7F37" font-size="17" font-weight="700">03</text><text x="0" y="64" text-anchor="middle" fill="#1F2328" font-size="15" font-weight="700">BUILD</text><text x="0" y="87" text-anchor="middle" fill="#57606A" font-size="12">Create a usable fix</text></g>
<g transform="translate(852 318)"><circle r="30" fill="#F8FAFC" stroke="#BF3989" stroke-width="2"/><text y="6" text-anchor="middle" fill="#BF3989" font-size="17" font-weight="700">04</text><text x="0" y="64" text-anchor="middle" fill="#1F2328" font-size="15" font-weight="700">OPERATE</text><text x="0" y="87" text-anchor="middle" fill="#57606A" font-size="12">Use it in practice</text></g>
<g transform="translate(1104 318)"><circle r="30" fill="#F8FAFC" stroke="#9A6700" stroke-width="2"/><text y="6" text-anchor="middle" fill="#9A6700" font-size="17" font-weight="700">05</text><text x="0" y="64" text-anchor="middle" fill="#1F2328" font-size="15" font-weight="700">IMPROVE</text><text x="0" y="87" text-anchor="middle" fill="#57606A" font-size="12">Remove the next friction</text></g>
<rect x="66" y="442" width="1068" height="70" rx="18" fill="#F6F8FA" stroke="#D0D7E2"/>
<text x="88" y="470" fill="#0969DA" font-size="14" font-weight="700">WHY DEVOPS / SYSTEMS ENGINEERING?</text>
<text x="88" y="494" fill="#24292F" font-size="13">I want to understand both the software people build and the systems, hardware, and operational environments that support it.</text>
