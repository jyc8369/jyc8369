        />
      </stop>
      <stop offset="1" stop-color="#0969DA">
        <animate
          attributeName="stop-color"
          values="#0969DA;#1A7F37;#8250DF;#0969DA"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" rx="34" fill="#F6F8FA"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="610"
    rx="28"
    fill="#FFFFFF"
    stroke="#D0D7E2"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#F0F3F7"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#6E7781"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"
  >jyc8369@github: ~/profile $ cat about.txt</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="126" fill="#8A949F" font-size="13" letter-spacing="2.7">ABOUT ME</text>
    <text x="70" y="172" fill="#1F2328" font-size="36" font-weight="700">I build software around friction I can actually see.</text>
    <text
      x="70"
      y="210"
      fill="#24292F"
      font-size="16"
    ><tspan x="70" dy="0">I look for repetitive, inconvenient, or unnecessarily complicated workflows,</tspan><tspan x="70" dy="27">then try to turn that friction into a focused tool or a small service I can actually use.</tspan></text>
    <g transform="translate(70 292)">
      <rect
        width="330"
        height="190"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="150"
        rx="4"
        fill="#8250DF"
      />
      <text x="52" y="43" fill="#8250DF" font-size="17" font-weight="700">01 · Notice real friction</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Start from a concrete inconvenience,</tspan><tspan x="52" dy="23">not from a feature list.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">Repetition · confusing steps · wasted time</tspan></text>
    </g>
    <g transform="translate(435 292)">
      <rect
        width="330"
        height="190"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="150"
        rx="4"
        fill="#0969DA"
      />
      <text x="52" y="43" fill="#0969DA" font-size="17" font-weight="700">02 · Build a usable fix</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Keep the scope small enough to understand,</tspan><tspan x="52" dy="23">but complete enough to be useful.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">Utilities · developer tools · automation</tspan></text>
    </g>
    <g transform="translate(800 292)">
      <rect
        width="330"
        height="190"
        rx="20"
        fill="#F6F8FA"
        stroke="#D0D7E2"
      />
      <rect
        x="20"
        y="20"
        width="8"
        height="150"
        rx="4"
        fill="#1A7F37"
      />
      <text x="52" y="43" fill="#1A7F37" font-size="17" font-weight="700">03 · Learn from operation</text>
      <text
        x="52"
        y="72"
        fill="#24292F"
        font-size="14"
      ><tspan x="52" dy="0">Deploy what I build and learn what becomes</tspan><tspan x="52" dy="23">difficult once software leaves localhost.</tspan><tspan x="52" dy="23"/><tspan x="52" dy="23">DevOps · Systems Engineering · reliability</tspan></text>
    </g>
    <text
      x="70"
      y="540"
      fill="#6E7781"
      font-size="14"
    ><tspan x="70" dy="0">Long-term goal: understand software, infrastructure, and the needs of the people using both.</tspan><tspan x="70" dy="24">I want to become an engineer who can connect development decisions with reliable system operation.</tspan></text>
  </g>
</svg>
