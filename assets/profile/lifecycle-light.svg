<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="66" y="118" fill="#6E7781" font-size="13" letter-spacing="2.6">LEARNING THROUGH SMALL SERVICES</text><text x="66" y="164" fill="#1F2328" font-size="34" font-weight="700">I learn the software lifecycle by operating what I build.</text><text x="66" y="198" fill="#24292F" font-size="15">Small services let me experience what software engineers need after code leaves the development machine.</text><rect x="66" y="226" width="1068" height="58" rx="16" fill="#F6F8FA" stroke="#D0D7E2"/><text x="90" y="252" fill="#0969DA" font-size="14" font-weight="700">THE LOOP</text><text x="184" y="252" fill="#24292F" font-size="13">Ship it, observe the real failure modes, fix them, then improve detection, recovery, or automation for next time.</text><path id="flow" d="M120 330H1080" fill="none" stroke="#D0D7E2" stroke-width="4" stroke-linecap="round"/><circle r="8" fill="#0969DA" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><g transform="translate(120 330)"><circle r="32" fill="#F8FAFC" stroke="#8250DF" stroke-width="2"/><text y="6" text-anchor="middle" fill="#8250DF" font-size="16" font-weight="700">01</text><text y="74" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">BUILD</text><text y="99" text-anchor="middle" fill="#57606A" font-size="12">Create the service</text></g><g transform="translate(360 330)"><circle r="32" fill="#F8FAFC" stroke="#0969DA" stroke-width="2"/><text y="6" text-anchor="middle" fill="#0969DA" font-size="16" font-weight="700">02</text><text y="74" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">DEPLOY</text><text y="99" text-anchor="middle" fill="#57606A" font-size="12">Move beyond localhost</text></g><g transform="translate(600 330)"><circle r="32" fill="#F8FAFC" stroke="#1A7F37" stroke-width="2"/><text y="6" text-anchor="middle" fill="#1A7F37" font-size="16" font-weight="700">03</text><text y="74" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">OBSERVE</text><text y="99" text-anchor="middle" fill="#57606A" font-size="12">Logs · metrics · state</text></g><g transform="translate(840 330)"><circle r="32" fill="#F8FAFC" stroke="#BF3989" stroke-width="2"/><text y="6" text-anchor="middle" fill="#BF3989" font-size="16" font-weight="700">04</text><text y="74" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">DEBUG</text><text y="99" text-anchor="middle" fill="#57606A" font-size="12">Resolve real failures</text></g><g transform="translate(1080 330)"><circle r="32" fill="#F8FAFC" stroke="#9A6700" stroke-width="2"/><text y="6" text-anchor="middle" fill="#9A6700" font-size="16" font-weight="700">05</text><text y="74" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">IMPROVE</text><text y="99" text-anchor="middle" fill="#57606A" font-size="12">Prevent the next failure</text></g><path d="M1080 330C1080 475 120 475 120 330" fill="none" stroke="#D0D7E2" stroke-width="2" stroke-dasharray="7 11"/><text x="600" y="494" text-anchor="middle" fill="#57606A" font-size="12">feedback loop: incident -> diagnosis -> prevention -> better operation</text><g transform="translate(66 528)"><rect width="1068" height="42" rx="15" fill="#F6F8FA" stroke="#D0D7E2"/><text x="534" y="27" text-anchor="middle" fill="#24292F" font-size="13">Linux · CI/CD · Containers · Networking · Observability · Infrastructure · Reliability</text></g></g>
