<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Learning through small services"><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250DF"><animate attributeName="stop-color" values="#8250DF;#0969DA;#1A7F37;#8250DF" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0969DA"><animate attributeName="stop-color" values="#0969DA;#1A7F37;#8250DF;#0969DA" dur="12s" repeatCount="indefinite"/></stop></linearGradient></defs><rect width="1200" height="700" rx="34" fill="#F6F8FA"/><rect x="20" y="20" width="1160" height="660" rx="28" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="2"/><path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#F0F3F7"/><circle cx="48" cy="46" r="6" fill="#FF5F56"/><circle cx="70" cy="46" r="6" fill="#FFBD2E"/><circle cx="92" cy="46" r="6" fill="#27C93F"/><text x="600" y="51" text-anchor="middle" fill="#6E7781" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ ./operate</text><rect x="20" y="71" width="1160" height="2" fill="url(#accent)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace"><text x="70" y="126" fill="#8A949F" font-size="13" letter-spacing="2.7">LEARNING THROUGH SMALL SERVICES</text><text x="70" y="172" fill="#1F2328" font-size="36" font-weight="700">Build. Deploy. Observe. Debug. Improve.</text><text x="70" y="210" fill="#24292F" font-size="16"><tspan x="70" dy="0">I build and deploy small services so I can experience the software lifecycle beyond development.</tspan><tspan x="70" dy="27">When something fails, I investigate it from the software engineer’s point of view and improve the next run.</tspan></text><path id="flow" d="M110 350 H1090" fill="none" stroke="#D0D7E2" stroke-width="4" stroke-linecap="round"/><circle r="8" fill="#0969DA"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><g transform="translate(110 350)"><circle r="30" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/><text y="6" text-anchor="middle" fill="#8250DF" font-size="14" font-weight="700">01</text><text x="0" y="65" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">BUILD</text><text x="0" y="90" text-anchor="middle" fill="#6E7781" font-size="12">Create the service</text></g><g transform="translate(355 350)"><circle r="30" fill="#FFFFFF" stroke="#0969DA" stroke-width="2"/><text y="6" text-anchor="middle" fill="#0969DA" font-size="14" font-weight="700">02</text><text x="0" y="65" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">DEPLOY</text><text x="0" y="90" text-anchor="middle" fill="#6E7781" font-size="12">Move beyond localhost</text></g><g transform="translate(600 350)"><circle r="30" fill="#FFFFFF" stroke="#1A7F37" stroke-width="2"/><text y="6" text-anchor="middle" fill="#1A7F37" font-size="14" font-weight="700">03</text><text x="0" y="65" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">OBSERVE</text><text x="0" y="90" text-anchor="middle" fill="#6E7781" font-size="12">Logs · metrics · state</text></g><g transform="translate(845 350)"><circle r="30" fill="#FFFFFF" stroke="#BF3989" stroke-width="2"/><text y="6" text-anchor="middle" fill="#BF3989" font-size="14" font-weight="700">04</text><text x="0" y="65" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">DEBUG</text><text x="0" y="90" text-anchor="middle" fill="#6E7781" font-size="12">Resolve real failures</text></g><g transform="translate(1090 350)"><circle r="30" fill="#FFFFFF" stroke="#9A6700" stroke-width="2"/><text y="6" text-anchor="middle" fill="#9A6700" font-size="14" font-weight="700">05</text><text x="0" y="65" text-anchor="middle" fill="#1F2328" font-size="16" font-weight="700">IMPROVE</text><text x="0" y="90" text-anchor="middle" fill="#6E7781" font-size="12">Prevent the next failure</text></g><text x="70" y="520" fill="#24292F" font-size="14"><tspan x="70" dy="0">What I learn from this loop:</tspan><tspan x="70" dy="25">• what deployment environments make development easier</tspan><tspan x="70" dy="25">• what logs and observability data are actually useful during incidents</tspan><tspan x="70" dy="25">• where automation can reduce repetitive operational work</tspan><tspan x="70" dy="25">• how reliability is designed through prevention, detection, diagnosis, and recovery</tspan></text><text x="70" y="660" fill="#6E7781" font-size="13">CI/CD · Linux · Containers · Networking · Observability · Reliability</text></g></svg>