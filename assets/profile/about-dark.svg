<text x="600.0" y="49" text-anchor="middle" fill="#8290A8" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ cat about.txt</text>
<rect x="20" y="67" width="1160" height="2" fill="url(#accent)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<text x="66" y="118" fill="#5D6B82" font-size="13" letter-spacing="2.6">ABOUT ME</text>
<text x="66" y="164" fill="#F2F6FF" font-size="34" font-weight="700">I build software around friction I can actually see.</text>
<text x="66" y="198" fill="#D8E1F0" font-size="15">I look for inconvenient, repetitive, or overly complex workflows and turn them into focused tools.</text>
<text x="66" y="223" fill="#D8E1F0" font-size="15">The goal is not more features — it is less friction for the person using the software.</text>
<path d="M96 318H1104" stroke="#26344D" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(96 318)"><circle r="30" fill="#0B1320" stroke="#C4B5FD" stroke-width="2"/><text y="6" text-anchor="middle" fill="#C4B5FD" font-size="17" font-weight="700">01</text><text x="0" y="64" text-anchor="middle" fill="#F2F6FF" font-size="15" font-weight="700">NOTICE</text><text x="0" y="87" text-anchor="middle" fill="#8290A8" font-size="12">Find real friction</text></g>
<g transform="translate(348 318)"><circle r="30" fill="#0B1320" stroke="#67E8F9" stroke-width="2"/><text y="6" text-anchor="middle" fill="#67E8F9" font-size="17" font-weight="700">02</text><text x="0" y="64" text-anchor="middle" fill="#F2F6FF" font-size="15" font-weight="700">UNDERSTAND</text><text x="0" y="87" text-anchor="middle" fill="#8290A8" font-size="12">Identify wasted steps</text></g>
<g transform="translate(600 318)"><circle r="30" fill="#0B1320" stroke="#4ADE80" stroke-width="2"/><text y="6" text-anchor="middle" fill="#4ADE80" font-size="17" font-weight="700">03</text><text x="0" y="64" text-anchor="middle" fill="#F2F6FF" font-size="15" font-weight="700">BUILD</text><text x="0" y="87" text-anchor="middle" fill="#8290A8" font-size="12">Create a usable fix</text></g>
<g transform="translate(852 318)"><circle r="30" fill="#0B1320" stroke="#F9A8D4" stroke-width="2"/><text y="6" text-anchor="middle" fill="#F9A8D4" font-size="17" font-weight="700">04</text><text x="0" y="64" text-anchor="middle" fill="#F2F6FF" font-size="15" font-weight="700">OPERATE</text><text x="0" y="87" text-anchor="middle" fill="#8290A8" font-size="12">Use it in practice</text></g>
<g transform="translate(1104 318)"><circle r="30" fill="#0B1320" stroke="#FBBF24" stroke-width="2"/><text y="6" text-anchor="middle" fill="#FBBF24" font-size="17" font-weight="700">05</text><text x="0" y="64" text-anchor="middle" fill="#F2F6FF" font-size="15" font-weight="700">IMPROVE</text><text x="0" y="87" text-anchor="middle" fill="#8290A8" font-size="12">Remove the next friction</text></g>
<rect x="66" y="442" width="1068" height="70" rx="18" fill="#101723" stroke="#26344D"/>
<text x="88" y="470" fill="#67E8F9" font-size="14" font-weight="700">WHY DEVOPS / SYSTEMS ENGINEERING?</text>
<text x="88" y="494" fill="#D8E1F0" font-size="13">I want to understand both the software people build and the systems, hardware, and operational environments that support it.</text>
</g>
