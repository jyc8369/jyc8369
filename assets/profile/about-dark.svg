<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<text x="70" y="126" fill="#5D6B82" font-size="13" letter-spacing="2.7">ABOUT ME</text><text x="70" y="172" fill="#F2F6FF" font-size="36" font-weight="700">I build software around friction I can actually see.</text><text x="70" y="210" fill="#D8E1F0" font-size="16"><tspan x="70" dy="0">I look for repetitive, inconvenient, or unnecessarily complicated workflows,</tspan><tspan x="70" dy="27">then try to turn that friction into a focused tool or a small service I can actually use.</tspan></text><g transform="translate(70 292)"><rect width="330" height="190" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="150" rx="4" fill="#C4B5FD"/><text x="52" y="43" fill="#C4B5FD" font-size="17" font-weight="700">01 · Notice real friction</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Start from a concrete inconvenience,</tspan><tspan x="52" dy="23">not from a feature list.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">Repetition · confusing steps · wasted time</tspan></text></g><g transform="translate(435 292)"><rect width="330" height="190" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="150" rx="4" fill="#67E8F9"/><text x="52" y="43" fill="#67E8F9" font-size="17" font-weight="700">02 · Build a usable fix</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Keep the scope small enough to understand,</tspan><tspan x="52" dy="23">but complete enough to be useful.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">Utilities · developer tools · automation</tspan></text></g><g transform="translate(800 292)"><rect width="330" height="190" rx="20" fill="#101723" stroke="#26344D"/><rect x="20" y="20" width="8" height="150" rx="4" fill="#4ADE80"/><text x="52" y="43" fill="#4ADE80" font-size="17" font-weight="700">03 · Learn from operation</text><text x="52" y="72" fill="#D8E1F0" font-size="14"><tspan x="52" dy="0">Deploy what I build and learn what becomes</tspan><tspan x="52" dy="23">difficult once software leaves localhost.</tspan><tspan x="52" dy="23"></tspan><tspan x="52" dy="23">DevOps · Systems Engineering · reliability</tspan></text></g><text x="70" y="540" fill="#8290A8" font-size="14"><tspan x="70" dy="0">Long-term goal: understand software, infrastructure, and the needs of the people using both.</tspan><tspan x="70" dy="24">I want to become an engineer who can connect development decisions with reliable system operation.</tspan></text>
</g>
