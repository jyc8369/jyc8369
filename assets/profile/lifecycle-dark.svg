<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
  role="img"
  aria-label="Learning through small services"
>
  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0" stop-color="#C4B5FD">
        <animate
          attributeName="stop-color"
          values="#C4B5FD;#67E8F9;#4ADE80;#C4B5FD"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="1" stop-color="#67E8F9">
        <animate
          attributeName="stop-color"
          values="#67E8F9;#4ADE80;#C4B5FD;#67E8F9"
          dur="12s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="34" fill="#070B12"/>
  <rect
    x="20"
    y="20"
    width="1160"
    height="680"
    rx="28"
    fill="#0D1117"
    stroke="#26344D"
    stroke-width="2"
  />
  <path d="M48 20H1152Q1180 20 1180 48V72H20V48Q20 20 48 20Z" fill="#080E19"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="70" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="92" cy="46" r="6" fill="#27C93F"/>
  <text
    x="600"
    y="51"
    text-anchor="middle"
    fill="#8290A8"
    font-size="14"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ ./operate</text>
  <rect
    x="20"
    y="71"
    width="1160"
    height="2"
    fill="url(#accent)"
  />
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="70" y="142" fill="#F2F6FF" font-size="36" font-weight="700">Build. Deploy. Observe. Debug. Improve.</text>
    <text
      x="70"
      y="184"
      fill="#D8E1F0"
      font-size="16"><tspan x="70" dy="0">I build and deploy small services to experience the software lifecycle beyond development.</tspan><tspan x="70" dy="27">When something fails, I use the incident as feedback for the next run.</tspan></text>
    <path
      id="flow"
      d="M110 330H1090"
      fill="none"
      stroke="#26344D"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle r="8" fill="#67E8F9">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#flow"/>
      </animateMotion>
    </circle>
    <g transform="translate(110 330)">
      <circle r="34" fill="#0B1320" stroke="#C4B5FD" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#C4B5FD" font-size="14" font-weight="700">01</text>
      <text y="75" text-anchor="middle" fill="#F2F6FF" font-size="17" font-weight="700">BUILD</text>
    </g>
    <g transform="translate(355 330)">
      <circle r="34" fill="#0B1320" stroke="#67E8F9" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#67E8F9" font-size="14" font-weight="700">02</text>
      <text y="75" text-anchor="middle" fill="#F2F6FF" font-size="17" font-weight="700">DEPLOY</text>
    </g>
    <g transform="translate(600 330)">
      <circle r="34" fill="#0B1320" stroke="#4ADE80" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#4ADE80" font-size="14" font-weight="700">03</text>
      <text y="75" text-anchor="middle" fill="#F2F6FF" font-size="17" font-weight="700">OBSERVE</text>
    </g>
    <g transform="translate(845 330)">
      <circle r="34" fill="#0B1320" stroke="#F9A8D4" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#F9A8D4" font-size="14" font-weight="700">04</text>
      <text y="75" text-anchor="middle" fill="#F2F6FF" font-size="17" font-weight="700">DEBUG</text>
    </g>
    <g transform="translate(1090 330)">
      <circle r="34" fill="#0B1320" stroke="#FBBF24" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#FBBF24" font-size="14" font-weight="700">05</text>
      <text y="75" text-anchor="middle" fill="#F2F6FF" font-size="17" font-weight="700">IMPROVE</text>
    </g>
    <g transform="translate(70 465)">
      <rect
        width="330"
        height="145"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <text x="28" y="43" fill="#C4B5FD" font-size="16" font-weight="700">Deployment reality</text>
      <text
        x="28"
        y="78"
        fill="#D8E1F0"
        font-size="13"><tspan x="28" dy="0">What changes outside localhost,</tspan><tspan x="28" dy="24">and what environments developers need.</tspan></text>
    </g>
    <g transform="translate(435 465)">
      <rect
        width="330"
        height="145"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <text x="28" y="43" fill="#4ADE80" font-size="16" font-weight="700">Useful signals</text>
      <text
        x="28"
        y="78"
        fill="#D8E1F0"
        font-size="13"><tspan x="28" dy="0">Which logs, metrics, and state</tspan><tspan x="28" dy="24">actually help during incidents.</tspan></text>
    </g>
    <g transform="translate(800 465)">
      <rect
        width="330"
        height="145"
        rx="20"
        fill="#101723"
        stroke="#26344D"
      />
      <text x="28" y="43" fill="#FBBF24" font-size="16" font-weight="700">Operational leverage</text>
      <text
        x="28"
        y="78"
        fill="#D8E1F0"
        font-size="13"><tspan x="28" dy="0">Where automation and prevention</tspan><tspan x="28" dy="24">remove repetitive operational work.</tspan></text>
    </g>
    <text x="70" y="665" fill="#8290A8" font-size="14">CI/CD · Linux · Containers · Networking · Observability · Reliability</text>
  </g>
</svg>
