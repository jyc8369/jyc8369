<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="66" y="118" fill="#5D6B82" font-size="13" letter-spacing="2.6">LEARNING THROUGH SMALL SERVICES</text><text x="66" y="164" fill="#F2F6FF" font-size="34" font-weight="700">I learn the software lifecycle by operating what I build.</text><text x="66" y="198" fill="#D8E1F0" font-size="15">Small services let me experience what software engineers need after code leaves the development machine.</text><rect x="66" y="226" width="1068" height="58" rx="16" fill="#101723" stroke="#26344D"/><text x="90" y="252" fill="#67E8F9" font-size="14" font-weight="700">THE LOOP</text><text x="184" y="252" fill="#D8E1F0" font-size="13">Ship it, observe the real failure modes, fix them, then improve detection, recovery, or automation for next time.</text><path id="flow" d="M120 330H1080" fill="none" stroke="#26344D" stroke-width="4" stroke-linecap="round"/><circle r="8" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><g transform="translate(120 330)"><circle r="32" fill="#0B1320" stroke="#C4B5FD" stroke-width="2"/><text y="6" text-anchor="middle" fill="#C4B5FD" font-size="16" font-weight="700">01</text><text y="74" text-anchor="middle" fill="#F2F6FF" font-size="16" font-weight="700">BUILD</text><text y="99" text-anchor="middle" fill="#8290A8" font-size="12">Create the service</text></g><g transform="translate(360 330)"><circle r="32" fill="#0B1320" stroke="#67E8F9" stroke-width="2"/><text y="6" text-anchor="middle" fill="#67E8F9" font-size="16" font-weight="700">02</text><text y="74" text-anchor="middle" fill="#F2F6FF" font-size="16" font-weight="700">DEPLOY</text><text y="99" text-anchor="middle" fill="#8290A8" font-size="12">Move beyond localhost</text></g><g transform="translate(600 330)"><circle r="32" fill="#0B1320" stroke="#4ADE80" stroke-width="2"/><text y="6" text-anchor="middle" fill="#4ADE80" font-size="16" font-weight="700">03</text><text y="74" text-anchor="middle" fill="#F2F6FF" font-size="16" font-weight="700">OBSERVE</text><text y="99" text-anchor="middle" fill="#8290A8" font-size="12">Logs · metrics · state</text></g><g transform="translate(840 330)"><circle r="32" fill="#0B1320" stroke="#F9A8D4" stroke-width="2"/><text y="6" text-anchor="middle" fill="#F9A8D4" font-size="16" font-weight="700">04</text><text y="74" text-anchor="middle" fill="#F2F6FF" font-size="16" font-weight="700">DEBUG</text><text y="99" text-anchor="middle" fill="#8290A8" font-size="12">Resolve real failures</text></g><g transform="translate(1080 330)"><circle r="32" fill="#0B1320" stroke="#FBBF24" stroke-width="2"/><text y="6" text-anchor="middle" fill="#FBBF24" font-size="16" font-weight="700">05</text><text y="74" text-anchor="middle" fill="#F2F6FF" font-size="16" font-weight="700">IMPROVE</text><text y="99" text-anchor="middle" fill="#8290A8" font-size="12">Prevent the next failure</text></g><path d="M1080 330C1080 475 120 475 120 330" fill="none" stroke="#26344D" stroke-width="2" stroke-dasharray="7 11"/><text x="600" y="494" text-anchor="middle" fill="#8290A8" font-size="12">feedback loop: incident -> diagnosis -> prevention -> better operation</text><g transform="translate(66 528)"><rect width="1068" height="42" rx="15" fill="#101723" stroke="#26344D"/><text x="534" y="27" text-anchor="middle" fill="#D8E1F0" font-size="13">Linux · CI/CD · Containers · Networking · Observability · Infrastructure · Reliability</text></g></g>
