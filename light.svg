        <g><animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.20;0.25;0.45;0.50;0.70;0.75;1" dur="4s" repeatCount="indefinite"/>
          <text y="0">             +--------+</text><text y="28">            /        /|</text><text y="56">           +--------+ |</text><text y="84">           |        | +</text><text y="112">          |   ::   |/</text><text y="140">          +--------+</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.20;0.25;0.45;0.50;0.70;0.75;1" dur="4s" repeatCount="indefinite"/>
          <text y="0">              +------+</text><text y="28">            /|     /|</text><text y="56">           +------+ |</text><text y="84">           | +----|-+</text><text y="112">          |/  :: |/</text><text y="140">          +------+</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.20;0.25;0.45;0.50;0.70;0.75;1" dur="4s" repeatCount="indefinite"/>
          <text y="0">             +--------+</text><text y="28">            |\        \</text><text y="56">            | +--------+</text><text y="84">            + |        |</text><text y="112">             \|  ::   |</text><text y="140">              +--------+</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.20;0.25;0.45;0.50;0.70;0.75;1" dur="4s" repeatCount="indefinite"/>
          <text y="0">               +------+</text><text y="28">              |\     \|</text><text y="56">              | +------+</text><text y="84">              +-|----+ |</text><text y="112">               \| ::  \|</text><text y="140">                +------+</text>
        </g>
