      <text x="525" y="148" fill="#1A7F37" font-size="16">$ whoami</text><text x="525" y="177" fill="#1F2328" font-size="28" font-weight="700">jyc8369</text>
      <text x="525" y="222" fill="#1A7F37" font-size="16">$ cat mission.txt</text>
      <g fill="#1F2328" font-size="15">
        <text x="525" y="250" opacity="0">Build practical tools for concrete problems.<animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.6s" fill="freeze"/></text>
