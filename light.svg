      <text x="525" y="425" fill="#656D76" font-size="13">github.com/jyc8369</text><circle cx="1012" cy="424" r="4" fill="#1A7F37"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
      <rect x="0" y="72" width="1100" height="2" fill="#1A7F37" opacity="0.12"><animate attributeName="y" values="72;468;72" dur="7s" repeatCount="indefinite"/></rect>
