    <rect x="20" y="20" width="1060" height="46" fill="#F6F8FA"/>
    <circle cx="46" cy="43" r="6" fill="#FF5F56"/><circle cx="66" cy="43" r="6" fill="#FFBD2E"/><circle cx="86" cy="43" r="6" fill="#27C93F"/>
    <text x="550" y="48" text-anchor="middle" fill="#656D76" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">jyc8369@github: ~/profile $ ./whoami --live</text>
    <rect x="20" y="65" width="1060" height="2" fill="url(#accentLine)"/>
