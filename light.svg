<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="jyc8369 animated terminal profile">
  <defs>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A7F37"><animate attributeName="stop-color" values="#1A7F37;#0969DA;#1A7F37" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#0969DA"><animate attributeName="stop-color" values="#0969DA;#1A7F37;#0969DA" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="screenClip"><rect x="20" y="20" width="1060" height="460" rx="18"/></clipPath>
  </defs>
  <rect width="1100" height="500" rx="20" fill="#F6F8FA"/>
