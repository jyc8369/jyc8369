<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Learning through small services"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8250DF"><animate attributeName="stop-color" values="#8250DF;#0969DA;#1A7F37;#8250DF" dur="12s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0969DA"><animate attributeName="stop-color" values="#0969DA;#1A7F37;#8250DF;#0969DA" dur="12s" repeatCount="indefinite"/></stop></linearGradient><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="22" fill="#F6F8FA"/><rect x="20" y="20" width="1160" height="380" rx="20" fill="#FFFFFF" stroke="#D0D7E2" stroke-width="2"/><rect x="20" y="20" width="1160" height="48" fill="#F0F3F7"/><circle cx="46" cy="44" r="6" fill="#FF5F56"/><circle cx="67" cy="44" r="6" fill="#FFBD2E"/><circle cx="88" cy="44" r="6" fill="#27C93F"/><text x="600" y="49" text-anchor="middle" fill="#57606A" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">jyc8369@github: ~/profile $ ./operate</text><rect x="20" y="67" width="1160" height="2" fill="url(#a)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="64" y="112" fill="#6E7781" font-size="12" letter-spacing="2.4">LEARNING THROUGH SMALL SERVICES</text><text x="64" y="152" fill="#1F2328" font-size="32" font-weight="700">Build → Deploy → Observe → Debug → Improve</text><text x="64" y="180" fill="#57606A" font-size="14">I deploy small services to learn what software engineers need after code leaves the development machine.</text><path id="flow" d="M110 250 H1090" fill="none" stroke="#D0D7E2" stroke-width="4" stroke-linecap="round"/><path d="M1090 250 C1090 335 110 335 110 250" fill="none" stroke="#D0D7E2" stroke-width="2" stroke-dasharray="5 9" opacity="0.9"/><circle r="7" fill="#0969DA" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><g transform="translate(110 250)"><circle r="24" fill="#F6F8FA" stroke="url(#a)" stroke-width="2"/><text y="5" text-anchor="middle" fill="#8250DF" font-size="13" font-weight="700">01</text><text x="0" y="50" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="700">BUILD</text><text x="0" y="70" text-anchor="middle" fill="#6E7781" font-size="11">Create the service</text></g><g transform="translate(355 250)"><circle r="24" fill="#F6F8FA" stroke="url(#a)" stroke-width="2"/><text y="5" text-anchor="middle" fill="#0969DA" font-size="13" font-weight="700">02</text><text x="0" y="50" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="700">DEPLOY</text><text x="0" y="70" text-anchor="middle" fill="#6E7781" font-size="11">Move beyond localhost</text></g><g transform="translate(600 250)"><circle r="24" fill="#F6F8FA" stroke="url(#a)" stroke-width="2"/><text y="5" text-anchor="middle" fill="#1A7F37" font-size="13" font-weight="700">03</text><text x="0" y="50" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="700">OBSERVE</text><text x="0" y="70" text-anchor="middle" fill="#6E7781" font-size="11">Logs · metrics · state</text></g><g transform="translate(845 250)"><circle r="24" fill="#F6F8FA" stroke="url(#a)" stroke-width="2"/><text y="5" text-anchor="middle" fill="#BF3989" font-size="13" font-weight="700">04</text><text x="0" y="50" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="700">DEBUG</text><text x="0" y="70" text-anchor="middle" fill="#6E7781" font-size="11">Resolve real failures</text></g><g transform="translate(1090 250)"><circle r="24" fill="#F6F8FA" stroke="url(#a)" stroke-width="2"/><text y="5" text-anchor="middle" fill="#9A6700" font-size="13" font-weight="700">05</text><text x="0" y="50" text-anchor="middle" fill="#1F2328" font-size="14" font-weight="700">IMPROVE</text><text x="0" y="70" text-anchor="middle" fill="#6E7781" font-size="11">Prevent the next failure</text></g><text x="600" y="365" text-anchor="middle" fill="#6E7781" font-size="12">CI/CD · Linux · Containers · Networking · Observability · Reliability</text></g></svg>